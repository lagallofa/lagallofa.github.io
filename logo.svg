<svg xmlns="http://www.w3.org/2000/svg" viewBox="-60 -60 120 120" role="img" aria-label="La Gallofa: seis personas en corro">
  <!-- Corro abierto de trazo fino: seis personas iguales mirando al centro (el espacio común) -->
  <defs>
    <g id="persona">
      <circle cy="-46" r="7"/>
      <path d="M-9,-25 C-9,-37 9,-37 9,-25 Z"/>
    </g>
  </defs>
  <g fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round">
    <use href="#persona"/>
    <use href="#persona" transform="rotate(60)"/>
    <use href="#persona" transform="rotate(120)"/>
    <use href="#persona" transform="rotate(180)"/>
    <use href="#persona" transform="rotate(240)"/>
    <use href="#persona" transform="rotate(300)"/>
  </g>
</svg>
